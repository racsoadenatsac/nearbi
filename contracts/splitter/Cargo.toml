[package]
name = "nearbi-splitter"
description = "NearBI revenue splitter: splits every NEP-141 sale onchain between contributors and treasury."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
near-contract-standards.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

[package.metadata.near.reproducible_build]
# The release WASM is built inside this exact image (pinned by digest).
# `bin/build.sh` runs container_build_command in it; SourceScan-style verifiers
# can run `cargo near build reproducible-wasm` and get the same bytes.
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
